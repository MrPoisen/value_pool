name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"
  RUSTUP_PERMIT_COPY_RENAME: true # Ensures act (https://github.com/nektos/act) works: https://github.com/rust-lang/rustup/issues/2949#issuecomment-2584968659

jobs:
  build_safe:

    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    - run: rustup toolchain install stable --profile minimal
    - uses: Swatinem/rust-cache@v2
    - name: Build
      run: cargo build --verbose
    - name: Run Clippy
      run: cargo clippy --no-deps --all-targets
    - name: Run tests
      run: cargo test --verbose

  build_unsafe:
    runs-on: ubuntu-latest
    steps:
     - uses: actions/checkout@v3
     - run: rustup toolchain install stable --profile minimal
     - uses: Swatinem/rust-cache@v2
     - name: Build
       run: cargo build --verbose --features unsafe
     - name: Run Clippy
       run: cargo clippy --no-deps --all-targets --features unsafe
     - name: Run tests
       run: cargo test --verbose --features unsafe

   
